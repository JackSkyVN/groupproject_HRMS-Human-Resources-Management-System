<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <base href="/login/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up</title>
    <link rel="stylesheet" href="style.css?v=202512230115">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <header>
        <div class="logo">Finova</div>
        <div class="contact-widget">
            <div class="contact-item">
                <i class="fas fa-phone-alt"></i>
                <span>Hotline: 502311090</span>
            </div>
            <div class="contact-item">
                <i class="fas fa-envelope"></i>
                <span>Director: ha1972816@finova.vn</span>
            </div>
            <div class="contact-item">
                <i class="fas fa-user-tie"></i>
                <span>Staff: tong1985928@finova.vn</span>
            </div>
        </div>
    </header>

    <main class="form-wrapper">

        <div class="form-container" id="login-form">
            <h2>Login</h2>
            <form action="#">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" placeholder="Username or Email" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password-input" placeholder="Password" required>
                    <i class="fas fa-eye" id="togglePassword"></i>
                </div>
                <button type="submit" class="submit-btn">Sign In</button>
                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember-login">
                        <label for="remember-login">Remember Me</label>
                    </div>
                    <a href="javascript:void(0)" class="forgot-password" id="forgot-password-link">Forgot
                        password?</a>
                </div>
            </form>
        </div>

    </main>

    <script type="module" src="../config.js"></script>
    <script type="module" src="script.js?v=999999999"></script>
</body>

</html>
