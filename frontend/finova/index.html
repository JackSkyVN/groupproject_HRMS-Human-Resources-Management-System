<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <base href="/finova/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=43">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="sidebar-title">Finova
                </h1>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-page="dashboard">
                    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span class="nav-text">Dashboard</span>
                </button>
                <button class="nav-item" data-page="employees">
                    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span class="nav-text">Employees</span>
                </button>
                <button class="nav-item" data-page="leave">
                    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span class="nav-text">Leave Management</span>
                </button>
                <div class="nav-group" id="attendance-nav-group">
                    <button class="nav-item" data-page="attendance">
                        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <span class="nav-text">Attendance</span>
                    </button>
                    <div class="submenu">
                        <button class="submenu-item" data-page="attendance-my">
                            <span class="nav-text">My Attendance</span>
                        </button>
                        <button class="submenu-item" data-page="attendance-team">
                            <span class="nav-text">Employee Attendance</span>
                        </button>
                    </div>
                </div>
                <div class="nav-group" id="performance-nav-group">
                    <button class="nav-item" data-page="performance">
                        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="20" x2="12" y2="10"></line>
                            <line x1="18" y1="20" x2="18" y2="4"></line>
                            <line x1="6" y1="20" x2="6" y2="16"></line>
                        </svg>
                        <span class="nav-text">Performance</span>
                    </button>
                    <div class="submenu">
                        <button class="submenu-item" data-page="performance-my">
                            <span class="nav-text">My Performance</span>
                        </button>
                        <button class="submenu-item" data-page="performance-team">
                            <span class="nav-text">Team Performance</span>
                        </button>
                    </div>
                </div>
                <div class="nav-group" id="salary-nav-group">
                    <button class="nav-item" data-page="salary">
                        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="1" x2="12" y2="23"></line>
                            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                        </svg>
                        <span class="nav-text">Salary Management</span>
                    </button>
                    <!-- Submenu will be injected here for HR -->
                </div>
                <button class="nav-item" data-page="announcements">
                    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span class="nav-text">Announcements</span>
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div id="logout-container" style="display: flex; gap: 10px;">
                <!-- Notification Bell -->
                <div class="notification-container">
                    <button id="notification-bell" class="icon-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span id="notification-badge" class="badge-count" style="display: none;">0</span>
                    </button>
                    <div id="notification-dropdown" class="notification-dropdown">
                        <div class="dropdown-header">
                            <span>Notifications</span>
                            <button id="mark-all-read-btn"
                                style="font-size: 12px; color: #3b82f6; border: none; background: none; cursor: pointer;">Mark
                                all read</button>
                        </div>
                        <div id="notification-list" class="dropdown-body">
                            <!-- Items -->
                        </div>
                    </div>
                </div>

                <button id="profile-btn"
                    style="display: flex; align-items: center; gap: 8px; padding: 8px 16px; border: none; background: none; cursor: pointer; color: #64748b; font-weight: 500;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    My Profile
                </button>
                <button id="logout-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Logout
                </button>
            </div>
            <div id="content-area"></div>
        </main>
    </div>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <!-- Modular JavaScript (NEW) -->
    <script type="module" src="js/main.js?v=DEBUG_DEPT_FILTER"></script>
</body>

</html>
