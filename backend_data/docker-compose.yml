version: "3.9"
services:
  frontend:
    build: ../frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: always

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - postgres
      - redis
    # Keep 8000 exposed for debugging or direct access if needed
    ports:
      - "8000:8000"
    volumes:
      - ./env.example:/app/.env
    # In production, we should set these from environment variables or a real .env file
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost,http://127.0.0.1,http://hrms-server
    restart: always

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: always

volumes:
  pgdata:
